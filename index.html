<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>朝刊ブリーフィング</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --card: #ffffff;
      --text: #1c1c1c;
      --muted: #5c5c5c;
      --accent: #0f4c81;
      --border: #e2ddd3;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
    }
    header {
      max-width: 760px;
      margin: 24px auto 16px;
      padding: 0 16px 12px;
      border-bottom: 2px solid var(--text);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 1.4rem;
    }
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    button {
      border: 1px solid var(--border);
      background: var(--card);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    #updated-at {
      margin-left: auto;
      font-size: 0.8rem;
      color: var(--muted);
    }
    main {
      max-width: 760px;
      margin: 0 auto 48px;
      padding: 0 16px;
      display: grid;
      gap: 14px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .source {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
      display: block;
    }
    .title-ja {
      margin: 0 0 6px;
      font-size: 1.08rem;
      font-weight: 700;
    }
    .title-en {
      margin: 0 0 10px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .summary-ja {
      margin: 0 0 10px;
      font-size: 0.94rem;
    }
    a.link {
      font-size: 0.84rem;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    a.link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>朝刊ブリーフィング（FT &amp; Economist）</h1>
    <div class="controls">
      <button class="active" data-source="ALL">すべて</button>
      <button data-source="Financial Times">Financial Times</button>
      <button data-source="The Economist">The Economist</button>
      <span id="updated-at">読み込み中...</span>
    </div>
  </header>

  <main id="news-list"></main>

  <script>
    let allArticles = [];
    let currentFilter = "ALL";

    async function loadNews() {
      try {
        const res = await fetch("./daily_news.json?t=" + Date.now());
        if (!res.ok) throw new Error("データ未生成");
        allArticles = await res.json();
        if (allArticles.length > 0 && allArticles[0].fetched_at) {
          document.getElementById("updated-at").textContent =
            "更新: " + allArticles[0].fetched_at + " JST";
        }
        render();
      } catch (e) {
        document.getElementById("news-list").innerHTML =
          "<p>まだ記事データがありません。GitHub Actions を実行してください。</p>";
      }
    }

    function render() {
      const container = document.getElementById("news-list");
      const filtered = currentFilter === "ALL"
        ? allArticles
        : allArticles.filter(a => a.source === currentFilter);

      container.innerHTML = filtered.map(item => `
        <article class="card">
          <span class="source">${item.source}</span>
          <h2 class="title-ja">${item.title_ja}</h2>
          <p class="title-en">${item.original_title}</p>
          <p class="summary-ja">${item.summary_ja}</p>
          <a class="link" href="${item.link}" target="_blank" rel="noopener noreferrer">元記事を開く →</a>
        </article>
      `).join("");
    }

    document.querySelectorAll("button[data-source]").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("button[data-source]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.source;
        render();
      });
    });

    loadNews();
  </script>
</body>
</html>
