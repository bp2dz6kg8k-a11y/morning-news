name: Daily News Briefing

on:
  schedule:
    # UTC 21:30 = 日本時間 06:30
    - cron: "30 21 * * *"
  workflow_dispatch: # 手動実行用ボタンを有効化

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser google-genai pydantic

      - name: Fetch and translate news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python fetch_and_translate.py

      - name: Commit and push updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily_news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update daily news" && git push)
